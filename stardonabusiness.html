<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARDONABUSINESS - Produits</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .produits {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .produit {
            text-align: center;
        }
        .produit img {
            width: 100%;
            border-radius: 10px;
        }
        .produit p {
            font-weight: bold;
            margin-top: 8px;
        }
        .fb-link {
            display: inline-block;
            margin: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>STARDONABUSINESS</h1>
        <button class="theme-toggle" id="themeToggle">🌙</button>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="projets.html">Projets</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <a href="https://www.facebook.com/share/1GsnQdk2eZ/" target="_blank" class="btn-projet fb-link">Voir la page Facebook</a>

        <div class="produits">
            <div class="produit">
                <img src="Image/sac1.jpg" alt="Sac noir">
                <p>15 000 FCFA</p>
            </div>
            <div class="produit">
                <img src="Image/sac2.jpg" alt="Sac beige">
                <p>15 000 FCFA</p>
            </div>
            <div class="produit">
                <img src="Image/sac3.jpg" alt="Sac marron">
                <p>15 000 FCFA</p>
            </div>
            <div class="produit">
                <img src="Image/sac4.jpg" alt="Sac marron 2">
                <p>15 000 FCFA</p>
            </div>
            <div class="produit">
                <img src="Image/jogging1.jpg" alt="Ensemble jogging">
                <p>30 000 FCFA</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 - STARDONA</p>
    </footer>
<script src="script.js"></script>
</body>
</html>
