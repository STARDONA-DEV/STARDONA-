<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARDONA - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Contact</h1>
        <p>Une question, un projet ? Écris-moi.</p><button class="theme-toggle" id="themeToggle">🌙</button>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="projets.html">Projets</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
       <section>
    <h2>Me contacter</h2>
    <form action="https://formspree.io/f/mdaqjjba" method="POST" class="contact-form">
        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="btn-projet">Envoyer</button>
    </form>
       </section>    
            
    </main>

    <footer>
        <p>&copy; 2026 - STARDONA</p>
    </footer>
<script src="script.js"></script>
</body>
</html>
